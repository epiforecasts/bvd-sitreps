project:
  type: website
  output-dir: _site
  # The site is index.qmd plus the English pages. The French corpus is the
  # record, not a page: rendered as markdown it produced 116 untitled HTML
  # files and doubled the render.
  render:
    - index.qmd
    - docs/*.qmd

website:
  title: "Ebola BVD 2026: Outbreak Sitreps"
  description: "Automated translation of Ebola-BVD 2026 outbreak situation reports"
  site-url: "https://epiforecasts.io/bvd-sitreps"
  navbar:
    right:
      - icon: github
        href: https://github.com/epiforecasts/bvd-sitreps
      - icon: house-fill
        text: " "
        href: index.qmd
  announcement:
    icon: cone-striped
    dismissable: true
    position: below-navbar
    content: '**Under development**'
    type: warning
  open-graph: true
format:
  html:
    theme: cosmo
    toc: true
    comments:
      hypothesis: true
