name: Update Sitreps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: actions/cache@v4
        with:
          path: /home/runner/R_groundhog
          key: r-groundhog-${{ runner.os }}-2026-05-20
          restore-keys: r-groundhog-${{ runner.os }}-

      - name: Run pipeline
        env:
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: Rscript R/main.R

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/csv/ data/pdf/
          git diff --cached --quiet || git commit -m "update sitreps $(date -u +%Y-%m-%d)"
          git push
