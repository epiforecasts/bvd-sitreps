name: Update Sitreps

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: actions/cache@v4
        with:
          path: ~/R/library
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}-2026-05-22
          restore-keys: r-${{ runner.os }}-

      - name: Install groundhog
        shell: Rscript {0}
        run: |
          if (!requireNamespace("groundhog", quietly = TRUE)) {
            install.packages("groundhog")
          }

      - name: Scrape new PDFs
        run: Rscript R/scrape-pdf.R

      - name: Extract markdown
        env:
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: Rscript R/extract-docs.R

      - name: Extract CSVs
        run: Rscript R/extract-tables.R

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/csv/ data/pdf/
          git diff --cached --quiet || git commit -m "update sitreps $(date -u +%Y-%m-%d)"
          git push
