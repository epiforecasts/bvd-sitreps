name: Update Sitreps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpoppler-cpp-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::httr2
            any::jsonlite
            any::pdftools
            any::here
            any::base64enc
            any::digest

      # PDFs are not committed: data/manifest.csv records each one's source URL
      # and md5, so they are refetched here and the md5 proves they are the same
      # files the corpus was built from.
      - name: Run pipeline
        env:
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        run: Rscript R/main.R

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.csv data/corpus/ data/csv/ data/corpus-qa.csv docs/
          git diff --cached --quiet || git commit -m "update sitreps $(date -u +%Y-%m-%d)"
          git push
